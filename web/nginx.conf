server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API + health to the backend service (name resolved inside the cluster/compose network).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2g;
  }
  # Tenant audits run synchronously and can outlast nginx's default 60s read timeout
  # (Exchange checks start a PowerShell session). Only the run endpoint needs the longer limit.
  location ~ ^/api/tenants/[^/]+/audits$ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location /mcp {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 2g;
  }
  location /health {
    proxy_pass http://api:8080;
  }
}
